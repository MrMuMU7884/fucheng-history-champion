<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>辅成·历史学霸 • 华小六年级</title>
  <meta name="theme-color" content="#101e67" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="branding.css" />
  <link rel="stylesheet" href="../compact-branding.css" />
  <link rel="stylesheet" href="../quiz-buttons.css" />
</head>
<body>
  <main class="game-shell">
    <div class="company-branding"><img src="company-logo.png" alt="辅成教育中心公司标志" /><p>辅成教育中心</p></div>
    <header>
      <div class="brand"><span class="brand-star">★</span> 《辅成·历史学霸》</div>
      <div id="counter" class="counter">第 1 题</div>
    </header>

    <section class="hero" aria-label="Kuiz Sejarah Tahun 6">
      <div class="money-ring ring-a"></div><div class="money-ring ring-b"></div>
      <p id="unitLabel" class="unit-label">单元 1 • 马来西亚的成立</p>
      <h1 id="question">Memuatkan soalan…</h1>
    </section>

    <section id="answers" class="answers" aria-label="Pilihan jawapan"></section>

    <section id="result" class="result" aria-live="polite"></section>
    <footer>
      <span id="score">得分：0 / 0</span>
      <div class="quiz-actions"><button id="actionButton" class="action-button" type="button" disabled>确认答案</button><button id="nextButton" class="action-button" type="button" hidden>下一题</button></div>
    </footer>
  </main>
  <script src="questions.js"></script><script src="../app.js"></script>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');</script>
</body>
</html>
